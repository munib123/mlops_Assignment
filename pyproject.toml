[project]
name = "mlops-assignment"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "dvc[s3]>=3.67.1",
    "joblib>=1.6.0",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "pandas>=3.0.6",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
]

[dependency-groups]
dev = [
    "detect-secrets>=1.5.0",
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.4",
    "jupytext>=1.19.5",
    "nbstripout>=0.9.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
